<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Exercice : Mécanismes d'une éruption volcanique</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: auto;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 750px;
            width: 100%;
        }

        h1 {
            color: #d32f2f;
            font-size: 20px;
            margin-top: 0;
            border-bottom: 2px solid #ffcdd2;
            padding-bottom: 8px;
        }

        .instruction {
            font-size: 14px;
            font-style: italic;
            color: #555;
            margin-bottom: 15px;
            background: #fffde7;
            padding: 10px;
            border-left: 5px solid #fbc02d;
        }

        #sortable-list {
            list-style-type: none;
            padding: 0;
            margin-bottom: 15px;
        }

        .paragraph-item {
            background: #fff;
            border: 1px solid #ddd;
            margin-bottom: 6px;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            font-size: 13.5px;
            transition: transform 0.4s ease-in-out, background-color 0.3s;
            position: relative;
        }

        .paragraph-text {
            flex-grow: 1;
            margin-right: 10px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .btn-move {
            background: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 12px;
            border-radius: 4px;
        }

        .btn-move:hover {
            background: #e0e0e0;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        #check-btn {
            background-color: #d32f2f;
            color: white;
        }

        #retry-btn {
            background-color: #607d8b;
            color: white;
            display: none;
        }

        #solution-btn {
            background-color: #1976d2;
            color: white;
            display: none;
        }

        #feedback {
            margin-top: 15px;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Ordonner les paragraphes : Les Éruptions Volcaniques</h1>
        <div class="instruction">Lisez les paragraphes ci‑dessous et déplacez-les pour expliquez, comment les
            différents mécanismes s’enchaînent pour aboutir à une éruption volcanique.</div>

        <ul id="sortable-list"></ul>

        <div class="actions">
            <button id="check-btn" onclick="checkOrder()">Vérifier</button>
            <button id="retry-btn" onclick="resetExercise()">Recommencer</button>
            <button id="solution-btn" onclick="showSolution()">Voir la solution</button>
        </div>
        <div id="feedback"></div>
    </div>

    <script>
        const correctOrderTexts = [
            "Dans les zones de subduction, la plaque océanique plonge sous la plaque continentale, entraînant une augmentation de la température et de la pression qui favorisent la fusion partielle des roches du manteau.",
            "Cette fusion produit du magma, généralement riche en silice, dont la viscosité retient les gaz dissous comme le dioxyde de carbone et la vapeur d'eau.",
            "Le magma s'accumule alors dans des réservoirs souterrains où il peut se différencier : cristallisation de minéraux, assimilation de roches hostiles et augmentation progressive de la pression interne.",
            "Lorsque la pression dépasse la résistance du toit rocheux, des fissures s'ouvrent ; le magma remonte le long de conduits, les gaz se détachent brusquement, ce qui génère une poussée exponentielle décrite par la loi P = ρ g h.",
            "Selon la teneur en silice et la quantité de gaz libérée, l'éruption se manifeste sous forme de coulées de lave fluides ou, au contraire, d'explosions violentes produisant des nuées ardentes.",
            "Les phénomènes associés — tsunamis, avalanches de débris, modification du climat — imposent des mesures de surveillance et la mise en place de zones d'évacuation."
        ];

        let currentOrder = [...correctOrderTexts].sort(() => Math.random() - 0.5);

        function renderList() {
            const list = document.getElementById('sortable-list');
            list.innerHTML = '';
            currentOrder.forEach((text, index) => {
                const li = document.createElement('li');
                li.className = 'paragraph-item';
                li.innerHTML = `<div class="paragraph-text">${text}</div>
                <div class="controls">
                    <button class="btn-move" onclick="handleMove(${index}, -1)">▲</button>
                    <button class="btn-move" onclick="handleMove(${index}, 1)">▼</button>
                </div>`;
                list.appendChild(li);
            });
        }

        function handleMove(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= currentOrder.length) return;
            const items = document.querySelectorAll('.paragraph-item');
            const offset = items[newIndex].offsetTop - items[index].offsetTop;
            items[index].style.transform = `translateY(${offset}px)`;
            items[newIndex].style.transform = `translateY(${-offset}px)`;
            setTimeout(() => {
                const temp = currentOrder[index];
                currentOrder[index] = currentOrder[newIndex];
                currentOrder[newIndex] = temp;
                renderList();
            }, 400);
        }

        function checkOrder() {
            let score = 0;
            const items = document.querySelectorAll('.paragraph-item');
            currentOrder.forEach((text, index) => {
                if (text === correctOrderTexts[index]) {
                    items[index].style.borderColor = "#4caf50";
                    items[index].style.backgroundColor = "#e8f5e9";
                    score++;
                } else {
                    items[index].style.borderColor = "#f44336";
                    items[index].style.backgroundColor = "#ffeeeb";
                }
            });

            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';
            if (score === correctOrderTexts.length) {
                feedback.innerHTML = "Bravo ! Tout est dans le bon ordre.";
                feedback.style.color = "#2e7d32";
                document.getElementById('retry-btn').style.display = 'none';
                document.getElementById('solution-btn').style.display = 'none';
            } else {
                feedback.innerHTML = `Score : ${score}/${correctOrderTexts.length}. Cherchez encore !`;
                feedback.style.color = "#d32f2f";
                document.getElementById('retry-btn').style.display = 'inline-block';
                document.getElementById('solution-btn').style.display = 'inline-block';
            }
        }

        function showSolution() {
            currentOrder = [...correctOrderTexts];
            renderList();
            const items = document.querySelectorAll('.paragraph-item');
            items.forEach(item => {
                item.style.borderColor = "#1976d2";
                item.style.backgroundColor = "#e3f2fd";
            });
            document.getElementById('feedback').innerHTML = "Voici l'ordre logique des mécanismes.";
            document.getElementById('feedback').style.color = "#1976d2";
            document.getElementById('solution-btn').style.display = 'none';
            document.getElementById('retry-btn').style.display = 'inline-block';
        }

        function resetExercise() {
            currentOrder = [...correctOrderTexts].sort(() => Math.random() - 0.5);
            renderList();
            document.getElementById('retry-btn').style.display = 'none';
            document.getElementById('solution-btn').style.display = 'none';
            document.getElementById('feedback').style.display = 'none';
        }

        renderList();
    </script>
</body>

</html>
